name: Build & Release

# Arma el instalador y lo publica. Sólo desde `main`.
#
# La verificación corre **antes y dentro del mismo flujo**, no en paralelo: como
# `verify.yml` también se dispara con el push a `main`, los dos corrían a la vez
# y un build roto se publicaba igual, porque el instalador no esperaba a que la
# verificación terminara. Por eso `release` declara `needs: verify`: si algo
# falla —tipos, lint, formato, tests o build del renderer— no se publica nada.
#
# Y el release se arma **en borrador**: se hace visible recién cuando está
# comprobado que está completo. El motivo está en "Reservar el release".

on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verificar
        run: npm run verify

  release:
    needs: verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin esto, **cualquier** push a `main` vuelve a publicar: un commit de
      # documentación rearmaba el instalador y reemplazaba los assets de un
      # release que ya estaba bien.
      #
      # Lo que se pregunta es si el release está **completo**, no si existe.
      # Preguntar si existía resultó peor que no preguntar nada: al publicar la
      # 2.1.0 el subido falló a mitad y dejó el release creado con un solo
      # archivo, y entonces este paso se negó a repararlo porque "ya estaba
      # publicado". Un release sin `latest.yml` no está publicado para nadie: es
      # lo primero que busca el updater.
      - name: ¿Esta versión ya está publicada y completa?
        id: publicada
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          completo=$(gh release view "v$version" --json isDraft,assets --jq "if (.isDraft | not) and ([.assets[].name] | index(\"latest.yml\")) then \"si\" else \"no\" end" 2>/dev/null || echo "no")
          if [ "$completo" = "si" ]; then
            echo "La v$version ya está publicada y tiene su latest.yml. No se rearma nada."
            echo "hay_que_publicar=no" >> "$GITHUB_OUTPUT"
          else
            echo "La v$version no está publicada, o está incompleta. Se publica."
            echo "hay_que_publicar=si" >> "$GITHUB_OUTPUT"
          fi

      # Misma versión que la verificación (`.nvmrc`): si el instalador se armara
      # con un Node distinto del que se verifica, el visto bueno diría menos de
      # lo que parece.
      - name: Setup Node.js
        if: steps.publicada.outputs.hay_que_publicar == 'si'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        if: steps.publicada.outputs.hay_que_publicar == 'si'
        run: npm ci --legacy-peer-deps

      # Antes de compilar: si falta la sección del CHANGELOG, esto corta el
      # flujo. Publicar sin notas es lo que se estaba tratando de arreglar, y en
      # silencio no se arregla nunca.
      - name: Preparar las notas de la versión
        if: steps.publicada.outputs.hay_que_publicar == 'si'
        run: node scripts/notas-de-version.mjs

      # electron-builder sube el instalador y el blockmap **en paralelo**, y
      # cada subida crea el release si todavía no existe. Las dos salieron
      # juntas al publicar la 2.1.0: una lo creó y la otra recibió un
      # `422 Validation Failed` de la API, que abortó el build **después** de
      # haber subido un archivo. Quedó un release marcado "Latest" con el
      # blockmap suelto, sin instalador y sin `latest.yml`.
      #
      # Creándolo acá, electron-builder no tiene que crear nada: sólo sube. Y va
      # en **borrador**, que es lo que hace que un subido a medias sea invisible
      # en vez de engañoso —el updater no ve los borradores—. Se publica al
      # final, cuando está comprobado.
      - name: Reservar el release en borrador
        if: steps.publicada.outputs.hay_que_publicar == 'si'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          version="${{ steps.publicada.outputs.version }}"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Ya existe un release v$version de un intento anterior: se reutiliza."
          else
            gh release create "v$version" --draft --title "$version" --target "${{ github.sha }}" --notes-file build/release-notes.md
            echo "Borrador v$version creado sobre ${{ github.sha }}."
          fi

      - name: Build & Publish
        if: steps.publicada.outputs.hay_que_publicar == 'si'
        run: npm run release -- --config.directories.output=release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # El subido puede fallar **después** de dejar el instalador arriba: el
      # release queda con el `.exe` pero sin `latest.yml`, se ve perfecto y el
      # updater nunca lo encuentra. Por eso se revisa acá y no a ojo.
      #
      # El sha512 es el que importa: que estén los tres archivos no alcanza si
      # cada uno quedó de un build distinto, y ése es el único de los tres que
      # falla sin decir nada.
      #
      # Se baja con `gh` y no con `curl` porque el release todavía es borrador y
      # sus archivos no están en la URL pública.
      - name: Verificar que el release quedó completo
        if: steps.publicada.outputs.hay_que_publicar == 'si'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          version="${{ steps.publicada.outputs.version }}"
          gh release download "v$version" --pattern "latest.yml" --output latest.yml --clobber || {
            echo "::error::El release v$version no tiene latest.yml: el auto-update no vería la versión nueva."
            exit 1
          }
          esperado=$(grep -m1 '^ *sha512:' latest.yml | sed 's/.*sha512: *//')
          tamanio=$(grep -m1 '^ *size:' latest.yml | sed 's/.*size: *//')
          nombre=$(grep -m1 '^path:' latest.yml | sed 's/path: *//')
          gh release download "v$version" --pattern "$nombre" --output instalador.exe --clobber
          real=$(openssl dgst -sha512 -binary instalador.exe | openssl base64 -A)
          real_tam=$(stat -c%s instalador.exe)
          if [ "$real" != "$esperado" ] || [ "$real_tam" != "$tamanio" ]; then
            echo "::error::latest.yml no corresponde al instalador subido. El auto-update fallaría al verificar la descarga."
            echo "  sha512 en latest.yml: $esperado"
            echo "  sha512 del .exe     : $real"
            echo "  size en latest.yml  : $tamanio"
            echo "  size del .exe       : $real_tam"
            exit 1
          fi
          echo "Release v$version completo y consistente ($real_tam bytes)."

      # Recién acá el release se vuelve visible, y con él el tag. Hasta este
      # punto un fallo no deja nada roto a la vista: deja un borrador, que el
      # próximo intento reutiliza.
      - name: Publicar el release
        if: steps.publicada.outputs.hay_que_publicar == 'si'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          version="${{ steps.publicada.outputs.version }}"
          gh release edit "v$version" --draft=false --latest
          echo "Publicado: https://github.com/${{ github.repository }}/releases/tag/v$version"
