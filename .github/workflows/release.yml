name: Build & Release

on:
  push:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Misma versión que el flujo de verificación (`.nvmrc`): si el
      # instalador se armara con un Node distinto del que se verifica, el visto
      # bueno de `verify` diría menos de lo que parece.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build & Publish
        run: npm run release -- --config.directories.output=release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
