name: Verificación

# Corre la misma verificación que se hace a mano antes de commitear: tipos,
# lint, formato, tests y build del renderer. La idea es que un push a una rama
# de trabajo avise por su cuenta, sin depender de que alguien se acuerde.
#
# El build del instalador NO va acá: es lento, necesita firmar y ya lo hace
# `release.yml` en `main`.

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # `sqlite3` trae binarios precompilados, pero si tuviera que compilarlos
      # el paso tardaría varios minutos: `--ignore-scripts` no sirve porque
      # entonces no se instalan. Se deja la instalación normal.
      - name: Install dependencies
        run: npm ci

      - name: Verificar
        run: npm run verify
