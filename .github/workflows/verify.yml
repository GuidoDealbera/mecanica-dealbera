name: Verificación

# Corre la misma verificación que se hace a mano antes de commitear: tipos,
# lint, formato, tests y build del renderer. La idea es que un push a una rama
# de trabajo avise por su cuenta, sin depender de que alguien se acuerde.
#
# El build del instalador NO va acá: es lento, necesita firmar y ya lo hace
# `release.yml` en `main`.

# **Sólo `push`, y a propósito.** Antes había además un disparador
# `pull_request`, y con un PR abierto cada commit generaba **dos** ejecuciones
# idénticas: el PR mostraba dos veces el mismo check. No hace falta, porque los
# checks se cuelgan del commit y no del evento: la corrida del push aparece
# igual en el PR. Se comprobó consultando los check-runs del commit.
#
# `main` queda afuera: ahí la verificación la corre `release.yml` como paso
# previo a publicar, para que el instalador espere el visto bueno.
on:
  push:
    branches-ignore:
      - main

# `cancel-in-progress: false`, que es lo contrario de lo que suele ponerse.
#
# Con `true` cada push cancelaba la verificación del commit anterior, y como la
# corrida tarda unos tres minutos, una tanda de commits seguidos dejaba a la
# mayoría **sin verificar**: de los once del Sprint A, cinco terminaron
# cancelados. Eso es justo lo que este flujo existe para evitar, y encima el
# "Error: The operation was canceled" del log parecía una falla.
#
# Acá cada commit es una tarea cerrada que se quiere saber si pasa, así que las
# corridas se encolan por rama en vez de pisarse. El grupo se mantiene para que
# no corran dos a la vez sobre la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La versión sale de `.nvmrc`, para que el CI y la máquina de desarrollo
      # no puedan desincronizarse. Node 20 no alcanza: jsdom 30 exige
      # `^22.22.2 || ^24.15.0` y arrastra undici 8, que exige `>=22.19.0`.
      # `npm ci` sólo advierte de eso, así que el fallo aparecía recién al
      # levantar el entorno de los tests de componentes.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # `sqlite3` trae binarios precompilados, pero si tuviera que compilarlos
      # el paso tardaría varios minutos: `--ignore-scripts` no sirve porque
      # entonces no se instalan. Se deja la instalación normal.
      - name: Install dependencies
        run: npm ci

      - name: Verificar
        run: npm run verify
