name: Verificación

# Corre la misma verificación que se hace a mano antes de commitear: tipos,
# lint, formato, tests y build del renderer. La idea es que un push a una rama
# de trabajo avise por su cuenta, sin depender de que alguien se acuerde.
#
# El build del instalador NO va acá: es lento, necesita firmar y ya lo hace
# `release.yml` en `main`.

# En `main` **no** corre desde acá: lo ejecuta `release.yml` como paso previo a
# publicar, y así el instalador espera el visto bueno en vez de armarse en
# paralelo. Duplicarlo sería pagar dos veces la misma verificación.
on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

# Con un pull request abierto, un push a la rama disparaba **dos** ejecuciones:
# una por el `push` y otra por el `pull_request`. Se veía en el historial, dos
# corridas idénticas con el mismo commit y el mismo segundo de arranque.
#
# El grupo usa `head_ref || ref_name` justamente para que las dos caigan en el
# mismo: en un pull request `head_ref` es el nombre de la rama y en un push está
# vacío, así que `ref_name` —que también es el nombre pelado, sin `refs/heads/`—
# lo cubre. Con `github.ref` no alcanzaba: en un pull request vale
# `refs/pull/N/merge` y nunca coincidiría.
#
# `cancel-in-progress` además descarta la corrida anterior cuando se pushea dos
# veces seguidas: lo que importa es el estado del último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La versión sale de `.nvmrc`, para que el CI y la máquina de desarrollo
      # no puedan desincronizarse. Node 20 no alcanza: jsdom 30 exige
      # `^22.22.2 || ^24.15.0` y arrastra undici 8, que exige `>=22.19.0`.
      # `npm ci` sólo advierte de eso, así que el fallo aparecía recién al
      # levantar el entorno de los tests de componentes.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # `sqlite3` trae binarios precompilados, pero si tuviera que compilarlos
      # el paso tardaría varios minutos: `--ignore-scripts` no sirve porque
      # entonces no se instalan. Se deja la instalación normal.
      - name: Install dependencies
        run: npm ci

      - name: Verificar
        run: npm run verify
