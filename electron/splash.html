<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Mecánica Dealbera</title>
    <!--
      Michroma es la tipografía del título de la aplicación. Se sirve desde
      Google Fonts (no hay un archivo en el repositorio), así que sin conexión no
      llega: por eso hay una pila de reserva y `display=swap`, para que el texto
      se vea igual desde el primer momento.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
        Paleta alineada con el tema de la aplicación (ver `hero.ts`):
        `--primary` es el mismo `#006FEE` que usa el sistema —y que está fijado
        igual en claro y en oscuro— y el fondo es el oscuro de HeroUI, que es el
        tema por defecto. Antes la pantalla de carga era blanca con un azul de
        Tailwind (`#3b82f6`) que no correspondía a ningún color de la interfaz:
        se veía un fogonazo blanco y después arrancaba la app en oscuro.

        La preferencia de tema se guarda en el `localStorage` del renderer, al que
        esta ventana no tiene acceso, así que se sigue el tema por defecto.
      */
      :root {
        --primary: #006fee;
        --primary-soft: #338ef7;
        --background: #000000;
        --surface: #18181b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        background: var(--background);
        /* Halo tenue del color de marca, para que el fondo no sea negro plano. */
        background-image: radial-gradient(
          circle at 50% 38%,
          rgba(0, 111, 238, 0.18),
          transparent 60%
        );
        font-family: "Michroma", "Trebuchet MS", "Segoe UI", sans-serif;
        user-select: none;
        overflow: hidden;
      }

      h1 {
        /* La ventana es de 600x600: con un tamaño fijo el título desbordaba. */
        font-size: clamp(1.5rem, 6.5vw, 2.5rem);
        line-height: 1.25;
        font-style: italic;
        font-weight: bold;
        color: var(--primary);
        text-align: center;
        letter-spacing: 0.02em;
        margin: 0 0 28px 0;
        text-shadow: 0 2px 18px rgba(0, 111, 238, 0.35);
      }

      .spinner {
        width: 54px;
        height: 54px;
        border: 5px solid rgba(255, 255, 255, 0.12);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Respeta la preferencia del sistema de reducir animaciones. */
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }

      p {
        margin: 14px 0 0 0;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        color: var(--primary-soft);
      }

      /*
        El escudo es un JPG (sin transparencia), así que sobre el fondo oscuro se
        vería como un rectángulo suelto: va dentro de una tarjeta clara para que
        se lea como algo intencional.
      */
      .logo-card {
        margin-top: 28px;
        padding: 6px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.08);
        line-height: 0;
      }
      .logo {
        width: 96px;
        height: auto;
        border-radius: 8px;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>MECÁNICA DEALBERA</h1>
    <div class="spinner"></div>
    <p>Cargando...</p>
    <div class="logo-card">
      <img
        class="logo"
        src="images/escudo-racing.jpg"
        alt="Escudo Racing Club de Avellaneda"
      />
    </div>
  </body>
</html>
